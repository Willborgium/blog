name: Build and deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: wjcustode-blog

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore solution
        run: dotnet restore Blog/Blog.sln

      - name: Generate blog content
        run: dotnet run --project Blog/Blog.Generator/Blog.Generator.csproj --configuration Release

      - name: Validate web project
        run: dotnet build Blog/Blog.Web/Blog.Web.csproj --configuration Release --no-restore

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy Blog/Blog.Web/wwwroot --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }}
