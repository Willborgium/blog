name: Validate static site generation

on:
  workflow_dispatch:

jobs:
  validate-static-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore solution
        run: dotnet restore Blog/Blog.sln

      - name: Generate static site
        run: dotnet run --project Blog/Blog.Generator/Blog.Generator.csproj --configuration Release

      - name: Validate generated output exists
        run: test -f site/index.html && test -d site/blog && test -d site/css
